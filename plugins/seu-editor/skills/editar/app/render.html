<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>render</title>
<link rel="stylesheet" href="/app/motion.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* opacidade um tiquinho abaixo de 1: o navegador sempre salva o PNG com canal de
     transparência. Sem isso, um quadro todo coberto por foto sai sem alfa, o FFmpeg
     reinicia a montagem no meio e solta quadros pretos. */
  #palco { position: absolute; left: 0; top: 0; opacity: .996; }
</style>
</head>
<body>
<div id="palco"><div class="tela" id="tela"></div></div>
<script src="/app/motion.js"></script>
<script>
  /* Página usada só na exportação: o navegador invisível chama quadro(t)
     e fotografa o resultado com fundo transparente. */
  let CTX = null;
  window.preparar = async ({ estilos, proj, plano, largura, camada }) => {
    Motion.configurar(estilos);
    CTX = { proj, plano, base: "", videos: false, tocando: false, camada: camada || null };
    const tela0 = document.getElementById("tela"); if (tela0._mapa) { tela0._mapa.clear(); tela0.innerHTML = ""; }
    const tela = document.getElementById("tela");
    tela.style.transform = `scale(${largura / 1080})`;
    await Motion.preparar(CTX);
    Motion.cena(tela, CTX, 0);
    return true;
  };
  window.quadro = async t => {
    const tela = document.getElementById("tela");
    const assinatura = Motion.cena(tela, CTX, t);
    // espera foto nova carregar antes da foto do quadro (senão sai um quadro vazio)
    await Promise.all([...tela.querySelectorAll("img")].map(i => (i.complete && i.naturalWidth) ? null : i.decode().catch(() => {})));
    return assinatura;
  };
</script>
</body>
</html>
